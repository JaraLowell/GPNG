# =============================================================================
# Graphic Packet (modern) — Config.toml
# -----------------------------------------------------------------------------
# Maps cleanly onto the classic CONFIG.GP keys from GP2862K.EXE / GP 1.61.
# Case is insignificant for legacy .GP files; TOML keys here are snake_case.
# =============================================================================

[station]
# Legacy: MYCALL — monitor call first, then per-channel overrides (comma-separated).
mycall = ["NL0MSK", "NL0MSK", "NL0MSK", "NL0MSK", "NL0MSK", "NL0MSK", "NL0MSK", "NL0MSK", "NL0MSK", "NL0MSK", ""]

# Legacy: ZONE / TIME — display timezone offset and PC-clock skew (minutes).
zone = "UTC"
time_offset_minutes = 0

[serial]
# Legacy: SERNR / SERPORT / SERIRQ / SERBAUD
# Prefer a modern device path (USB-serial). SERPORT/SERIRQ remain optional
# for documentation / migration from DOS IO-port based setups.
port = "COM6" # Linux/macOS examples: "/dev/ttyUSB0", "/dev/tty.usbserial-*"
# TM-D710 KISS: Kenwood docs use 9600 here — must match radio Menu PC PORT SPEED
# (9600/19200/38400/57600). Only set 19200 if the radio menu is also 19200.
baud = 9600 # SERBAUD
com_number = 6 # SERNR (informational when `port` is set)
# Optional DOS legacy fields (omit when unused — TOML has no null):
# io_port = 0x3F8      # SERPORT — unused on modern USB-serial
# irq = 4              # SERIRQ — unused on modern USB-serial
fast_poll = "auto"     # FASTPOLL: "auto" | "on" | "off"
multiport = "auto"     # MULTIPORT: "auto" | "on" | "off"

port_detail = "USB-K5G Radio Cable"
[session]
# Legacy: CHANNELS, MAXSPY, buffers, bells, remote, spy, …
channels = 10
max_spy = 1
connect_bell = 3
rx_click = 1
screensave_minutes = 0
popup_time_seconds = 3
popup_enable_keyboard = false
insert_mon_line = false
questions = false
backup = true
# DOS Zoom. 1 = off (JetBrains Mono Regular), 2 = on (Bold). Setup menu and ALT-Z.
zoom = 1
prompt = "%c to %y>"
noname = "%c"
remote_language = "EN"
# Setup menu. Word wrapping and input columns are stored; the editor does not hard-wrap yet.
input_columns = 81
editor_wrap = 255
editor_bak = false
bbs_channel = 2
list_channel = 1
file_drawer = ""
# Legacy LOG. When true, a disconnect appends one line to data/LOG/<base call>.GPL.
log = false
# Legacy UTC. Minutes added to the PC clock for that journal line.
utc_offset_min = 0
security = false
remote = []
no_remote = []
auto_spy = []
no_auto_spy = ["NL0MSK"]
auto_spy_minimum_save = 512
# MHeard Auto Clean. Stations last heard more than this many days ago are
# removed about once an hour. 0 disables. Maximum 365.
mheard_clean_days = 14
# Spy windows 1..10 — empty string = inactive slot.
spy_calls = ["", "", "", "", "", "", "", "", "", ""]

# Channel window ANSI colour inside a payload (ESC, also written \x1b or \033).
# true: [0m resets, [1m is bright, [30m–[37m set the foreground.
# [40m–[47m background codes are removed and not applied.
# false: strip every colour sequence and keep the normal channel colour.
allow_color_ansi = true

# Session-bar button state (restored on start; rewritten when you toggle).
icon_file = "ICONS-A.GP"
[session.chrome]
qrg_mhz = 27.235
ctext = "D:\\MyPython\\GPNG\\data\\CTEXT.GPI"
channel_ctext = ["", "", "", "", "", "", "", "", "", "", ""]
umlaut = 0
softscroll = 0
echo = 2047
bell = 0
seven_plus = 0
remote = 2046
scr_lock = false
hour_gong = false
[buffers]
# Legacy line counts (≈80 columns each in classic GP).
text_buffer = [600, 300]   # TEXTBUFFER: monitor scrollback, then channel scrollback
edit_buffer = 1000
check_buffer = 200
list_buffer = 200
spy_buffer = 100
mh_buffer = 50
input_buffer = 200
# Max bytes of typed text or a text file in one packet (classic GP: 128).
# KISS uses data/KISS.INI [params] PACLEN for this size (0 means 256).
# Newlines are `\n` and stay inside the packet; they do not each start one.
# 144Mhz 255 and up
packet_payload = 254

[paths]
# Legacy: USERDIR, EXTERNALDIR, SAVEDIR, LOGDIR, SPYDIR
# All of these live under data/ so a release folder stays exe + Config.toml + data/.
user_dir = "data/USER"
external_dir = "data/EXTERNAL"
save_dir = "data/SAVE"
log_dir = "data/LOG"
spy_dir = "data/SPY"

[tnc]
# Legacy: TNCINI / TNCDEI / TNCDOS — WA8DED / TFPCX hostmode command strings.
# "DateTime" is a GP pseudo-command that syncs the TNC clock from the host.
# KISS does not read this list. After enter-KISS it sends data/KISS.INI
# [params] (Esc T / P / W update that section). O and F stay host-side.
init = [
    "DateTime",
    "@V0",
    "K 2",
    "O 4",
    "P 160",
    "T 50",
    "W 30",
    "R 1",
    "M %M",
    "C CQ",
    "X 1",
    "N 5",
]
deinit = [
    "MN",
    "U1Away!",
    "K2",
    "JHOST0",
]
dos_shell = [
    "MN",
]

# WA8DED open/close INI ([open] / [status] / [close]) — preferred over init[]/deinit[].
wa8ded_ini = "data/WA8DED.INI"
wa8ded_line_delay_ms = 300

# Modem driver (only one is loaded): "wa8ded" (aliases: jhost, hostmode),
# "tfpcx" (soft-TNC), or "kiss" (TAPR KISS over serial or TCP).
protocol = "kiss"

# Monitor flags at connect — expanded as %M in WA8DED.INI / KISS.INI (e.g. M %M → M IUSC).
monitor_mode = "IUSC"

# KISS wire: "serial" = Kenwood etc. via [serial] port/baud + KISS.INI;
# "tcp" = Soundmodem / Direwolf raw KISS TCP (no KISS.INI).
kiss_transport = "serial"
kiss_tcp_host = "127.0.0.1"
kiss_tcp_port = 8200 # UZ7HO Soundmodem KISS TCP; Direwolf often 8001

# KISSINIT-style open/close (serial KISS only). See data/KISS.INI sections.
kiss_ini = "data/KISS.INI"
kiss_section = "TM-D710"   # open profile: TM-D710 | TM-D710_9600pkt | TM-D700 | …
kiss_close_section = "close"
kiss_char_delay_ms = 30
kiss_line_delay_ms = 300
kiss_exit_delay_ms = 5000  # settle after RESTART (classic KISSINIT -D exit)

[colors]
# Legacy VGA attribute names preserved for theme migration / future TUI.
clock_background = "DarkGreen"
input_foreground = "White"
input_background = "LightBlue"
input_invers_attr = "White"
monitor_foreground = "LightGreen"
monitor_background = "Blue"
monitor_infoerror = "Orange"
connect_foreground = "White"
connect_background = "DarkGray"
state_background = "Magenta"
state_foreground = "White"
state_invers_attr = "White"
menu_background = "Red"
menu_foreground = "Orange"
menu_invers_attr = "White"
border_attr = "White"
connect_invers_attr = "LightGreen"
monitor_invers_attr = "LightGray"
editor_foreground = "White"
editor_background = "Blue"
check_foreground = "White"
check_background = "Blue"
check_invers_attr = "Yellow"
editor_invers_attr = "LightGreen"
list_background = "Cyan"
list_foreground = "White"
list_invers_attr = "Yellow"
mh_background = "Blue"
mh_foreground = "LightCyan"
mh_invers_attr = "Cyan"
spy_background = "Blue"
spy_foreground = "White"
spy_invers_attr = "LightCyan"

[beacon]
address = "CQ"
source = "file"
text = ""
file = "D:\\MyPython\\GPNG\\data\\BEACON.GPI"
period_minutes = 60
[print]
# Legacy ESC/P printer attribute byte sequences.
default_print = [27, 53, 27, 70]
invers_print = [27, 52, 27, 69]

[window]
x = 1217
y = 152
width = 1155
height = 807
maximized = false
