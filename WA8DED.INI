; WA8DED / JHOST open & close sequences for Graphic Packet (modern).
; Lines are sent as channel-0 hostmode frames: <ch=0><code=1><len><text>
; Pseudo-command DateTime → K dd/mm/yy + K hh:mm:ss
; After each line we wait briefly for a TNC reply (shown in Monitor).
;
; Select file via Config.toml: [tnc] wa8ded_ini = "WA8DED.INI"

[open]
; Bring-up after JHOST1 (mirrors classic TNCINI / your Python start path).
DateTime
@V0
K 2
O 3
P 63
T 63
W 9
R 1
M %M
C CQ
X 1
N 6

[status]
; Read-backs used to build the timing banner (F / @T2 / @T3).
F
@T2
@T3

[close]
; Un-attended / leave hostmode (matches your Python shutdown).
MN
U1Away!
K2
JHOST0
