[meta]
name = "Portuguese"

[help]
overview = '''

  //<n> <Text>           : Envia texto para o canal <n>
  //7+ <ON/OFF>          : Liga (ON) ou desliga (OFF) 7+ AutoSave 
  //Activity             : Informaçao sobre a atividade do SysOp
  //Bell                 : Chama o SysOp tocando a campainha
  //CATalog [wildcard]   : Lhe da uma lista de arquivos disponiveis
  //CUT                  : Aborta transferencia de arquivo
  //DELete               : Apaga o arquivo criado pelo comando //Write
  //DIRectory [wildcard] : como //CATalog
  //DISConnect           : Disconect rapido (sem despedida)
  //Echo <text>          : Envia <text> de volta
  //END                  : Termina armazenamento de texto lançado por //Write
  //Help                 : Este texto de ajuda 
  //Info                 : Envia uma informaçao sobre esta estaçao
  //Kill                 : Suprime mensagem <call>.gpm
  //Language <language>  : Lista idiomas disponiveis, //L <l> muda idioma
  //MHeard [number]      : Mostra lista MHEARD          
  //MHeard <call>        : Mostra a hora da estaçao <call> listada ultima.
  //Name <name>          : Grava o seu nome no disco se nao for conhecido
  //NEws                 : Indica novidades (se tiver alguma)
  //PRompt <ON/OFF>      : Liga (ON) ou desligar (OFF) o prompt remoto
  //Quit                 : Termina o contato
  //Read <filename>      : Envia o arquivo "nome arquivo"
  //RPrg <filename>      : Envia o arquivo "nome arquivo" em modo AutoBin
  //RTt <portnr>         : Mostra 'round trip time'
  //RUN <program>        : Lança um programa externo
  //Usage [call]         : Estado do canal ou informacao sobre "call"
  //VERsion              : Mostra a versao deste programa
  //Write <filename>     : Armazena texto no arquivo "nome do arquivo"
  //WPrg <filename>      : Armazena arquivo no modo AutoBin
  //# [Text]
  //7DECODE <file>
  //CSTATUS
  //MAil
  //PARameters
  //SEnd <call>

  Tecle o comando sempre no começo de uma linha e termina com <Return>.
  Para a ajuda mais detalhada tecle "//Help <comando>".
'''

[help.commands]
"7+" = '''

  //7+ <ON/OFF>
      Este comando ativa ou destiva o 7+ AutoSave (ON/OFF) e pode ser
      usado quando voce quer mandar alguns arquivos 7+  caso o operador 
      nao estiver na estacao.
'''
"7DECODE" = '''
  //7DECODE <file>
      Joins 7Plus part files already stored in USER. <file> may be a part
      name (README.P01) or the original name (README.TXT). The first part
      supplies the part count. Missing parts are reported; when every part
      is present the original file is written and the parts are deleted.
'''
ACTIVITY = '''

  //Activity
      Este comando mostra o periodo de tempo depois da ultima atividade do
      SysOp nos termos de tocar numa tecla ou mexer o mouse.
'''
BELL = '''

  //Bell
      Este comando chama o SysOp tocando a campainha. 
      
'''
CATALOG = '''

  //CATalog [wildcard]
      Esta funçao, igual a de //CAT, mostra os arquivos acessiveis no
      diretorio de usuarios. Todos os arquivos dentro desse diretorio 
      podem ser lidos e enviados atraves dos comandos //Read ou //RPrg. 
      Tambem //Write ou //WPrg armazenam arquivos dentro deste diretorio.
      Pode usar estrelinhas (wildcards) com este comando, como por
      exemplo, "//DIR *.txt" ou "//DIR *.txt;*.doc"
'''
CSTATUS = '''
  //CSTATUS
      Lists only channels that have a connection. The first line is
      Channel state, then the date, time, and timezone (%D %T %Z).
      Each link is one line: this station's call, an arrow, and the
      other station. <-- means they called in. --> means this station
      called out.
             Chan   1: NL1STK     <--  NL0MSK
'''
CUT = '''
  //CUT
      Aborts the file transfer on this channel and returns to chat.
      BIN-RX, or a 7+ capture, sends #ABORT# (#NO# if the BIN file has
      not started). BIN-TX stops. A sender that has already sent file
      bytes also sends #ABORT# so the receiver leaves the file.
'''
DELETE = '''

  //DELete <arquivo>
      Este comando suprime um arquivo do diretorio de usuarios. 
      Somente pode apagar os arquivos que tem sido enviados com //Write. 
      O resto dos arquivos so podera ser apagado pelo SysOp desta estaçao.
'''
DIRECTORY = '''

  //DIRectory [wildcard]
      Esta funçao, igual a de //CAT, mostra os arquivos acessiveis no
      diretorio de usuarios. Todos os arquivos dentro desse diretorio 
      podem ser lidos e enviados atraves dos comandos //Read ou //RPrg. 
      Tambem //Write ou //WPrg armazenam arquivos dentro deste diretorio.
      Pode usar estrelinhas (wildcards) com este comando, como por
      exemplo, "//DIR *.txt" ou "//DIR *.txt;*.doc"
'''
DISCONNECT = '''

  //DISConnect
      Este comando termina o QSO imediatamente, sem nenhum texto de
      despedida e sem confirmaçao dos pacotes. 
'''
ECHO = '''

  //Echo <texto>
      Este comando e' um eco simples e envia o <texto> a outra estaçao que o
      manda de volta <texto>. Separe 6 <texto> do comando utilizando um
      <espaço>.
'''
END = '''

  //END
      Aborta a transferencia de todo arquivo de texto que tem sido iniciada
      com o comando //Write. Este comando nao pode ser utilizado para abortar 
      as transferencias no modo AutoBin.
'''
HELP = '''

  //Help
      Informaçao geral:
      Tecle o comando sempre no começo de uma linha e termina com <Return>.
      Cada comando remoto deve ser iniciado por "//", senao acontecera nada.
      Todos os comandos podem ser abreviados. Um possivel parametro 
      ao comando deve ser separado do mesmo com um unico <espaço>. 
      Se o comando requer mais de um parametro, o resto dos mesmos deverao 
      ser separados tambem por espaços.
'''
INFO = '''

  //Info
      Mostra um texto de informaçao sobre esta estaçao.
  
'''
LANGUAGE = '''
  //Language <language>
      Muda o idioma da UI e da ajuda (codigos ISO: en, pt, es…).
      Sem parametro lista os idiomas.
'''
MAIL = '''
  //MAIL
      Mostra o correio para o seu indicativo. Nao e transferencia de arquivo.
      //Read envia arquivo. SSID numerico e a mesma caixa. Sem correio:
      You have no mail
'''
MHEARD = '''

  //MHeard [numero]
      Este comando mostra a lista de estaçoes escutadas. Com um numero
      no final do comando (separado por um unico <espaco>, o GP
      envia esse numero de ultimas estaçoes ouvidas. O comando sem 
      algum numero envia a lista das ultimas 20 estaçoes ouvidas.
'''
N = '''
  //<n> [text]
      Where n is a number. Bare //n joins chat on channel n. Everything
      you type is sent to that channel, and text from that channel (and
      other joiners) is sent back to you on the air. The room is told
      "<GPNG>: CALL (Name) Joined your channel!". //0 leaves and announces
      Left. With text, //n sends one line only and does not stay in chat
      mode. Target must be a connected TERM channel.
'''
"#" = '''
  //# [text]
      Where # is a number. Bare //# joins chat on channel #. Everything
      you type is sent to that channel, and text from that channel (and
      other joiners) is sent back to you on the air. The room is told
      "<GPNG>: CALL (Name) Joined your channel!". //0 leaves and announces
      Left. With text, //# sends one line only and does not stay in chat
      mode. Target must be a connected TERM channel.
'''
NAME = '''

  //Name <nome>
      Se seu nome nao esta armazenado no arquivo de rotas do GP,
      pode usar este comando para registra-lo. Deixe um <espaco> para 
      separar o nome do comando. O nome em si pode consistir em qualquer 
      sequencia de letras, incluindo o <espaço>.
'''
NEWS = '''

  //NEws
      Este comando mostra as ultimas noticias desta estaçao, se tiver
      alguma.
'''
PARAMETERS = '''
  //PARameters
  //P
      Queries TNC timing parameters (P-Persistence, Slottime, Frack,
      T2, T3, TXDelay, MaxUnack). On WA8DED the values are read live from
      the TNC; otherwise the last known or WA8DED.INI / init[] values.
'''
PROMPT = '''

  //PRompt <ON/OFF>
      Este comando ativa (ON) e desativa (OFF) a presentaçao do Prompt
      remoto. Se esta em ON, aparecera o Prompt quando terminou
      a execuçao de qualquer comando remoto, para indicar que o sistema
      esta pronto para processar o comando seguinte.
'''
QUIT = '''

  //Quit
      Pode usar este comando para terminar o QSO em vez de um simples
      desconexao pela hardware (DISC). Este comando envia e confirma os
      pacotes antes de realizar a desconexao.
      Com este comando recebera um texto de despedida antes de 
      desconectar.
'''
READ = '''
  //Read <filename>
      Envia um arquivo texto. Lista com "//CATalog".
      Correio e //MAIL, nao esta transferencia.
'''
RPRG = '''

  //RPrg <arquivo>
      Esta funçao envia um arquivo no modo AutoBin.
      Primero tem que habilitar o seu GP para receber o arquivo no 
      modo AutoBin antes de enviar o comando remoto.
      O modo AutoBin e' compativel com os programas SP e THP.
'''
RTT = '''

  //RTt <porta>
      Este comando calcula o tempo de ida e volta medio entre o envio 
      de um pacote e sua acusaçao por esta estaçao 
      (chamado "Round Trip time"). O programa que esta utilizando 
      deve possuir o comando remoto "//Echo", senao a coisa nao funcionara. 
      
'''
RUN = '''
  //RUN <program>
      Runs a program from the EXTERNAL folder and sends what it prints
      back on this link. //RUN ? lists the programs. //<program> is the
      same when that name is not already a command.

      A program is a text script the sysop placed in EXTERNAL: Python,
      PHP, Perl, Ruby, Node, Lua, or Java. Java cannot open a window.
      The first line may name the program, for example
      #! /usr/bin/env python3, #! /usr/bin/perl, or
      #! /usr/lib/cgi-bin/php7.2.
      That line is read on Linux, macOS, and Windows. The language must
      be installed on the sysop computer. Words after the name are
      arguments, not a path.

      //RUN FREE
          Memory total, used, and still free.

      If the script reads a line, the next text from this connection is
      that line, and the program stays open while it waits. A second
      //RUN answers "program is running". When the script exits, it is
      closed. It also closes after 300 seconds with no typed line
      and no new text. A station still connected is told
      "closed run program after timeout".
      One program per channel. It also stops when the link drops.
'''
SEND = '''
  //SEND <call>
      A proxima linha e mensagem para essa estacao. Resposta:
      GPNG: Mail send to <call>
'''
USAGE = '''

  //Usage [indivativo]
      Este comando sem outros parametros mostra o estado atual dos
      canais desta estaçao.
      Se vc poe um indicativo ao comando vai obter uma breve
      informacao sobre aquela estaçao, se a mesma esta armazenada
      no arquivo de rotas do GP.
'''
VERSION = '''

  //VERsion
      Mostra o numero da versao deste software.
'''
WPRG = '''

  //WPrg <arquivo>
      Este comando inicia a gravaçao de um arquivo no modo AutoBin.
      O modo AutoBin e' um protocolo simples de transferencia com 
      verificaçao de CRC, mas e' incapaz de corregir os erros.
      Este modo AutoBin e' compativel com THP e SP.
'''
WRITE = '''

  //Write <arquivo>
      Este comando inicia a gravaçao de um texto. Todo o texto recebido
      depois este comando sera gravado no arquivo "nome do arquivo" ate
      de enviar um Control-Z ou o comando //END.
'''
KILL = '''
  
  //Kill                 
      Suprime a sua mensagem <call>.gpm
'''
