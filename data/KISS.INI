; File d'inizializzazione per KISSINIT v1.00
;
; Questo file contiene la sequenza dei comandi piu' utilizzati per
; settare un tnc in modo KISS, la sequenza dei comandi deve essere
; richiamata con l'opzione -S<sezione> e con l'opzione -F<file> si
; richiama il file di settaggio.
;
;
;[TF]                    ; TNC2 / The Firmware
;^X\e@K
;
;[TAPR]                  ; TNC2 / TAPR-Software
;KISS ON
;RESTART
;
;[PK232]                 ; PK232
;*
;*
;*
;HB 1200
;*
;VH OFF
;*
;KISS ON
;
;[reset]                 ; Reset PK232
;*
;*
;reset
;
[KAM]                    ; KAM V5.0
PORT 1
INT KISS
RESET
;
;[MFJ]                   ; MFJ-127x
;KISS ON
;RESTART
;

[TS2000_ORG]	; Kenwood TS-2000 / 1k2
\k\d\d\d\d\d	; KISS-Reset und 5s Pause
SOFTDCD ON
HBAUD 1200
TX 20
FR 8
KISS ON
RESTART			; Bei Aufruf KISSINIT wird eine 5s Pause mitgegeben (wichtig!)

[TS2000]		; Kenwood TS-2000 / 1k2
\d\d\d\d\d      ; Wait 5 seconds to ensure radio serial buffer is clear
;TC 0            ; CRITICAL: Turns off trace monitoring to prevent lockups
;DCD ON          ; Enables internal squelch/data carrier detect
HB 1200         ; Correct Kenwood syntax for 1200 bps over-the-air RF speed
KISS ON         ; Switch Tasco chip to KISS mode wrapper
RESTART         ; Reboot TNC into KISS lock. Front panel LEDs will flash.
\d\d\d\d\d      ; Wait 5 seconds for the reboot cycle to finish

[TS2000_9600]	; Kenwood TS-2000 / 9k6
\k\d\d\d\d\d	; KISS-Reset und 5s Pause
SOFTDCD ON
HBAUD 9600
TX 20
FR 8
KISS ON
RESTART			; Bei Aufruf KISSINIT wird eine 5s Pause mitgegeben (wichtig!)

; Kenwood TM-D700 / TM-D710 PACKET → KISS
; Manual: KISS ON then RESTART enters KISS. UI-View “Into KISS” = CR, KISS ON, RESTART
; (Kenwood FAQ adds HB 9600 for 9k6 on-air). PC baud = Menu PC PORT SPEED (usually 9600).
; Radio: [TNC] until PACKET12. MONITOR/MCOM are cmd-mode only — useless once in KISS
; (host gets all frames via KISS). WA8DED "M IUSC" is not a Kenwood command (?bad).
; \k = C0 FF C0 exit if still in KISS; \013\ = one sync CR (first CR after exit may ?EH).
[TM-D700]
\k\d\d\d\d\d\
\013\
KISS ON
RESTART

; APRS / PACKET12 (1200 on-air). Frames arrive as KISS → app AX.25 UI decode.
[TM-D710]
\k\d\d\d\
\013\
HB 1200
KISS ON
RESTART

[TM-D710_9600pkt]	; Kenwood FAQ: HB 9600 before KISS ON for 9600 bps packet
\k\d\d\d\
\013\
HB 9600
KISS ON
RESTART

; Leave KISS on program exit (also sent as raw C0 FF C0 by the driver).
[close]
\k\d\d\

; Not a command-mode script — do not select this as kiss_section.
; Sent after the modem is in KISS (serial, once the radio section has run, or TCP).
[params]
; Each live line is:  <Esc letter> <cmd> <value> <name>
; Esc <letter> <number> sends  FEND | (port<<4)|cmd | value | FEND
; and writes the new value back on that line.
;
; cmd  name       meaning                                              Esc
;  1   TXDELAY    10 ms units. Key-up delay before the first flag.     T
;  2   PERSIST    0–255. Chance to key up when the channel is idle.    P
;  3   SLOTTIME   10 ms units. CSMA slot (WA8DED W).                    W
;  4   TXTAIL     10 ms units. Key-down after the last flag.
;             Not sent unless a line is added, e.g.  Y 4 4 TXTAIL
;  5   FULLDUP    0 = half duplex, 1 = full.
;             Not sent unless a line is added, e.g.  D 5 0 FULLDUP
;  6   SetHardware   more than one data byte — not a line here.
;  FF  Return        leave KISS. That is [close] / \k, not an Esc param.
;
; O (max unacked) and F (frack) stay in the host AX.25 stack. Esc O / Esc F
; are not KISS frames. Config.toml [tnc] init is the hostmode list
; (WA8DED / TFPCX); KISS does not read it.
;
; Starting values are the T / P / W lines from Config.toml [tnc] init.
;
; PACLEN is the TNC command and the info-field size of every AX.25 frame
; we build. It is not a FEND command. Esc PACLEN <0-256>. 0 means 256 bytes.
; On serial the same command is sent before KISS ON (256 is sent as PACLEN 0).
; This number is [buffers] packet_payload while KISS is selected.
T 1 40 TXDELAY
P 2 63 PERSIST
W 3 20 SLOTTIME
PACLEN 254
