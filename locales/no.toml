[meta]
name = "Norwegian"

[help]
overview = '''

  //<n> <Text>           : Send en tekst til kanal <n>
  //7+ <ON/OFF>          : Skrur 7+ AutoSave av eller på
  //ACtivity             : S¢ker sysop aktivitet
  //Bell                 : Kaller Sysop ved hjelp av ringesignal
  //CATalog [wildcard]   : Viser en liste over alle lesbare filer
  //CD                   : Skifter til annen katalog i bruker katalogen
  //CD ..                : Skifter til ett lavere katalognivå
  //CUT                  : Avbryter en filoverf¢ring
  //DELete               : Sletter en fil som er opprettet med //Write
  //DIRectory [wildcard] : som //CATalog
  //DISConnect           : Hurtig disconnect (uten avskjed)
  //Echo <tekst>         : Sender tilbake <tekst>
  //END                  : Avslutter lagring av tekst startet med //Write
  //Help [komando]       : Denne teksten eller flere detaljer med "komando"
  //Info                 : Sender info om denne stasjonen
  //Language <språk>     : Endrer meldingenes språk
  //MHeard [tall]        : Viser en liste med h¢rte stasjoner
  //MHeard <kallesignal> : Viser klokkeslett sist <kallesignal> var h¢rt
  //Name <navn>          : Lagrer ditt navn hvis det ikke er kjent
  //NEws                 : Viser nytt (hvis det er noe nytt)
  //PRompt <ON/OFF>      : Skrur på/av Remote Prompt
  //Quit                 : Avslutter kontakten
  //Read <filnavn>       : Sender filen "filenavn"
  //RPrg <filnavn>       : Sender filen "filenavn" i AutoBin mode
  //RTt <portnr>         : Viser the round trip time
  //RUN <program>        : Kj¢rer et eksternt program, //RUN ? viser program
  //Usage [kallesignal]  : Kanal status eller kort info om "kallesignal"
  //VERsion              : Viser versjonsnummeret til programvaren
  //Write <filnavn>      : Lagrer den f¢lgende tekst i filen "filnavn"
  //WPrg <filnavn>       : Lagrer en fil i AutoBin mode

  Alle komandoer må begynne i f¢rste kolonne helt til venstre og avsluttes 
  med CR.
  Tast "//h h" for flere detaljer.
'''

[help.commands]
CD = '''

  //CD
     Denne komandoen fungerer som DOS komando CD. Adgang gis kun til 
     kataloger som er lagt inn og åpnet for eksterne brukere av SYSOP.
     Komandoen f¢rer brukeren til et nytt nivå i katalogtreet.
     //CD .. f¢rer brukeren til et lavere nivå i katalogtreet så sant
     du ikke allerede befinner deg i laveste åpne katalog.

@CD..,2
     
  //CD
     Denne komandoen fungerer som DOS komando CD. Adgang gis kun til 
     kataloger som er lagt inn og åpnet for eksterne brukere av SYSOP
     Komandoen f¢rer brukeren til et nytt nivå i katalogtreet.
  //CD .. 
     f¢rer brukeren til ett lavere nivå i katalogtreet så sant
     du ikke allerede befinner deg i laveste åpne katalog.
'''
"7+" = '''

  //7+ <ON/OFF>
      Denne komando skrur 7+ AutoSave på eller av. Du kan bruke denne 
      komandoen hvis du ¢nsker å sende noen 7+ filer, men operat¢ren ikke er
      til stede ved stasjonen, og du er usikker på om han har satt på 
      7+ AutoSave eller ikke.
'''
ACTIVITY = '''

  //Activity
      Denne komandoen viser hvor lenge siden sysop sist trykket en tast
      eller beveget musa.
'''
WPRG = '''

  //WPrg <filnavn>
      Denne komandoen starter lagring av en fil i AutoBin mode.
      AutoBin mode er en enkel ovef¢rings protokoll som inneholder en CRC
      sjekk. Beklageligvis retter den ikke opp feil.
      AutoBin mode er kompatibel med THP og SP.
'''
WRITE = '''

  //Write <filnavn>
      Denne komandoen starter lagring av en tekst. All tekst etter denne 
      komando vil bli lagret i filen "filnavn" inntil du sender Ctrl-Z 
      eller komandoen //END.
'''
VERSION = '''

  //VERsion
      Viser versjonsnummeret til denne programvaren.
'''
USAGE = '''

  //Usage [call]
      Komandoen uten andre parameter viser den aktuelle kanals satus på 
      denne stasjonen.
      Hvis du legger et call til komandoen, vil du få en kort informasjon
      om stasjonen, hvis det er lagret informasjon om stasjonen i GP.
'''
RUN = '''

  //RUN <program>
      Denne funksjonen kj¢rer et eksternt program og sender resultatet til
      TNCen. Alle eksterne program må bruke standard DOS output rutiner 
      ellers vil de ikke virke sammen med GP.
      Parameteret "?" vil sende tilbake en liste over tilgjengelige program.

      Det kan kj¢res to typer av eksterne program:

      a) Standard ekstern program
        Start av slike program betår av fem steg:
             1.: Åpne en midlertidig fil på disken.
             2.: Styre DOS enheten CON til denne filen.
             3.: Kj¢re programet. Output til skjermen vil nå bli skrevet 
                 til filen.
             4.: Les den midlertidige filen og send den til TNCen.
             5.: Slett den midlertidige filen.
        Disse programmene kan være programert av en hviken som helst bruker 
        av GP og skrevet i hvilket som helst språk. Det eneste du må ta i
        betraktniger er at du bruker DOS Handle 1 (standard output device) 
        for dine skjermutskrifter.

      b) GPRI program
        Siden versjon 1.50 har GP inkludert et spesielt program grensesnitt 
        som er kalt GPRI (Graphic Packet Remote Interface). Dette 
        grensesnittet tillater interaktiv komunikasjon mellom det eksterne
        programmet og den eksterne brukeren. GPRI-program kj¢rer i en slags
        "multitasking", slik at flere oppkoblete brukere kan kj¢re disse 
        programmene samtidig.
        
'''
RPRG = '''

  //RPrg <filnavn>
      Denne funksjonen sender en fil i AutoBin mode. Du må f¢rst sette ditt
      eget program klart til å motta filen i AutoBin mode f¢r du sender 
      fjernstyrings komandoen.
      AutoBin mode er kompatibel med THP og SP.
'''
READ = '''

  //Read <filnavn>
      Denne komandoen sender deg en tekst fil. Du kan få en liste over alle
      lesbare filer ved å sende komandoen "//CATalog".
'''
QUIT = '''

  //Quit
      Denne komandoen kan bli brukt for å avslutte en QSO istedenfor en 
      simpel "hard disconnect". Hvis du bruker denne komandoen vil du få 
      en avskjedstekst f¢r QSOen blir avsluttet.
'''
PROMPT = '''

  //PRompt <ON/OFF>
      Denne komando slår "remote prompten" på eller av. Hvis den er på, vil 
      prompten komme fram når en remote komando er utf¢rt for å vise at
      systemet er klart til å ta imot neste komando.
'''
NEWS = '''

  //NEws
      Denne komando vil vise noen nyheter hvis det eksisterer noen.
'''
NAME = '''

  //Name <navn>
      Hvis ditt navn ikke er lagret i GP's navnefil, kan du bruke denne
      komandoen for å legge ditt navn i filen. Du må bruke et <MELLOMROM> 
      for å skille navnet fra komandoen. Selve navnet kan bestå av hvilke
      som helst tegn, inkludert <MELLOMROM>.
'''
MHEARD = '''

  //MHeard [nummer]
      Denne komando viser deg en liste over h¢rte stasjoner. Hvis du legger 
      til et tall til komandoen (skilt med et enkelt <MELLOMROM>), vil GP 
      sende dette antall sist h¢rte stasjoner. Komandoen uten noe tall vil
      vise deg en liste over de 20 siste h¢rte stasjoner.
'''
INFO = '''

  //Info
      Viser en informasjon om denne satsjonen.
'''
HELP = '''

  //Help
      Generell informasjon:
      Alle komandoer må begynne i f¢rste kolonne og avsluttes med et <CR>.
      Du må begynne hver komando med "//" ellers vil ingenting skje.
      Alle komandoer kan forkortes. Hvis du f¢yer en parameter til komandoen, 
      må du skille den med et enkelt <MELLOMROM> fra selve komandoen. Hvis en
      komando trenger mer enn en parameter, må også alle parametrene skilles
      med et enkelt <MELLOMROM>.
      En komando inkludert parametre må ikke være lenger enn 80 tegn.
      
'''
END = '''

  //END
      Avbryter en filoverf¢ring som ble startet med //Write. Denne komandoen
      kan ikke bli brukt til å avbryte en AutoBin overf¢ring.
'''
ECHO = '''

  //Echo <tekst>
      Denne komandoen er et enkelt ekko som sender tilbake den påf¢lgende
      tekst. Skill teksten fra komandoen med et <MELLOMROM>.
'''
DISCONNECT = '''

  //DISConnect
      Denne komando avslutter QSO'en umiddelbart uten noen avskjedstekst.
'''
DIRECTORY = '''

  //DIRectory [wildcard]
      Denne komandoen returnerer innholdet i bruker katalogen. Alle filene
      kan bli lest med //Read eller //RPrg. Også //Write eller //WPrg skriver 
      filer til denne katalogen.
      Du kan bruke wildcards sammen med denne komandoen, f.eks. "//DIR *.txt". 
      Du kan til og med bruke flere wildcards skilt med et semikolon.
      F.eks. "//DIR *.txt;*.doc"
'''
DELETE = '''

  //DELete <filename>
      Denne komandoen tillater deg å slette en fil fra bruker katalogen.
      Du kan bare slette filer som du selv har lagt inn med //Write. Andre 
      filer kan bare slettes av stasjonenes sysop.
'''
CUT = '''

  //CUT
      Hvis du har startet en filoverf¢ring med //Read, kan du ved hjelp av
      denne komandoen avbryte filoverf¢ringen.
'''
CATALOG = '''

  //CATalog [wildcard]
      Denne komandoen returnerer innholdet i bruker katalogen. Alle filene
      kan bli lest med //Read eller //RPrg. Også //Write eller //WPrg skriver 
      filer til denne katalogen.
      Du kan bruke wildcards sammen med denne komandoen, f.eks. "//CAT *.txt". 
      Du kan til og med bruke flere wildcards skilt med et semikolon.
      F.eks. "//CAT *.txt;*.doc"
      
'''
BELL = '''

  //Bell
      Denne komandoen aktivisere en ringeklokke for å vekke sysop.
'''
LANGUAGE = '''

  //Language <språk>
      Med denne komandoen kan du endre språket på fjernstyrings meldingene.
      Komandoen uten parameter returnerer en liste med mulige språk.
'''
RTT = '''

  //RTt <portnr>
      Denne komandoen regner ut the round trip mellom våre stasjoner.
      Ditt program må være i stand til å utf¢re fjernstyrings komandoen
      "//Echo", eller vil ikke denne komandoen virke. Hvis du bruker BayCom 
      eller Digicom, legg til aktuell portnr til komandoen. F.eks "//RT 1".
'''
