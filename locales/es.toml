[meta]
name = "Spanish"

[help]
overview = '''

  //<n> <Texto>          : Envía el <texto> al canal <n>
  //Bell                 : Llamada al Sysop
  //Actividad            : Pregunta por ultima actividad del Sysop
  //CATalog [wildcard]   : Muestra una lista de todos los ficheros leíbles
  //CUT                  : Aborta una transferencia de fichero
  //DELete               : Borra un fichero que se haya escrito con //Write
  //DIRectory [wildcard] : Lo mismo que //CATalog
  //DISConnect           : Desconexión rápida (sin esperas)
  //Echo <text>          : Envía de regreso el <texto>
  //END                  : Termina una grabación manual de texto de //Write
  //Help [comando]       : Este mensaje o más ayuda sobre el "comando"
  //Info                 : Envía la info sobre esta estación, si existe
  //Language <lenguaje>  : Cambia el lenguaje de los mensajes
  //MHeard [numero]      : Muestra una lista de las estaciones oídas
  //Name <nombre>        : Almacena tu nombre si no es aún conocido
  //NEws                 : Muestra las últimas noticias (si las hay)
  //PRompt <ON/OFF>      : Pone en on/off el "prompt remoto"
  //Quit                 : Solicita la desconexión
  //Read <filename>      : Envía el fichero "filename"
  //RPrg <filename>      : Envía el fichero "filename" en modo AutoBin
  //RTt <núm. de port>   : Muestra el tiempo medio del enlace
  //RUN <programa> <?>   : Ejecuta un programa externo, o lista ejecutables
  //Usage [call]         : Estado del canal o información corta sobre "call"
  //VERsion              : Muestra el número de Versión de este Software
  //Write <filename>     : Almacena el texto o que se envíe en "filename"
  //WPrg <filename>      : Graba un fichero en modo AutoBin

  Todos los comandos deben comenzar en la primera columna y acabar con un CR.
  Teclee "//h h" para más detalles.
'''

[help.commands]
WPRG = '''

  //WPrg <filename>
     Este comando inicia la grabación de un fichero en modo AutoBin.
      El modo AutoBin es un protocolo simple de transferencia que contiene
      un chequeo de CRC. Por desgracia, es incapaz de corregir los errores.
      Este modo AutoBin es compatible con el THP y con el SP.
'''
WRITE = '''

  //Write <filename>
      Este comando inicia la grabación de un texto. Todo el texto recibido
      tras este comando será grabado en el fichero "filename" hasta que se
      envíe un Control-Z o el comando //END.
'''
VERSION = '''

  //VERsion
      Muestra el número de la versión de este software.
'''
USAGE = '''

  //Usage [call]
      Este comando, sin más parámetros, muestra el estado actual de los
      canales de esta estación.
      Si se añade un indicativo (call) al comando, se obtendrá una corta
      información sobre dicha estación, si la misma está almacenada
      en el fichero de rutas del GP.
'''
RUN = '''

  //RUN <programa>
      Esta función ejecuta un programa externo y envía la salida del mismo 
      al TNC.
      Todos los programas externos deben usar la gestión  de salida standard
      del DOS para poder trabajar con el GP.
      El parámetro "?" enviará de regreso una lista de los programas
      disponibles.

      Una llamada a un programa externo consta de 5 fases:
	   1.: Abrir un fichero temporal en el disco.
	   2.: Redireccionar el dispositivo CON del DOS al fichero.
	   3.: Correr el programa. La salida de la pantalla será escrita en
	       el fichero.              
	   4.: Leer el fichero temporal y enviar su contenido al TNC.
	   5.: Borrar el fichero temporal.
      Los programas externos pueden ser realizados por cualquier usuario del
      GP en cualquier lenguaje de programación. La única cosa a tener en 
      consideración es el usar el "Handle" 1 del DOS (salida de dispositivo
      standard) para las salidas a la pantalla. 
'''
RPRG = '''

  //RPrg <filename>
      Esta función envía un fichero en el modo AutoBin.
      Primero debe indicarse al programa propio que se prepare para recibir
      el fichero en modo AutoBin antes de enviar el comando remoto.
      El modo AutoBin es compatible con los programas SP y THP.
'''
READ = '''

  //Read <filename>
      Este comando te envía un fichero de texto. Puede obtenerse un listado
      de todos los ficheros leíbles utilizando el comando "//CATalog".
'''
QUIT = '''

  //Quit
      Puede usarse este comando para terminar el QSO en vez de una simple
      desconexíon por hardware (DISC). Este comando envía y acusa los
      paquetes pendientes antes de realizar la desconexión.
      Si se usa este comando, se recibirá un texto de despedida antes de 
      desconectar.
'''
PROMPT = '''

  //PRompt <ON/OFF>
      Este comando activa (ON) y desactiva (OFF) la presentación del Prompt
      remoto. si está en ON, aparecerá el Prompt cuando se haya terminado
      la ejecución de cualquier comando remoto, para indicar que el sistema
      está listo para procesar el siguiente comando.

@NEWS,2

  //NEws
      Este comando mostrará las últimas noticias de esta estación, si es
      que existe alguna.
'''
NAME = '''

  //Name <nombre>
      Si tu nombre no está aún almacenado en el fichero de rutas del GP,
      puede usarse este comando para añadir tu nombre al fichero. Debe
      utilizarse un <espacio> para separar al nombre del comando. El nombre
      en sí puede consistir en cualquier cadena de caracteres, incluyendo al
      <espacio>.
'''
MHEARD = '''

  //MHeard [número]
      Este comando muestra la lista de estaciones escuchadas. Si se incluye
      un número al final del comando (separado por un único <espacio>, el GP
      enviará ese número de últimas estaciones oídas . El comando aislado, 
      sin un número enviará la lista de las últimas 2o estaciones oídas.
'''
INFO = '''

  //Info
      Muestra un texto de información sobre esta estación.
'''
HELP = '''

  //Help
      Información general:
      Todos los comandos degen comenzar en la primera columna y terminarse
      con un retorno de carro <CR>.
      Cada comando remoto debe ser precedido por "//", o no ocurrirá nada.
      Todos los comandos pueden enviarse abreviados. Si se añade algún
      parámetro al programa, debe separarse del comando con un solo
      carácter de <espacio>. Si el comando requiere más de un parámetro,
      el resto de los mismos deberá ir también separado por espacios.
      La totalidad de caracteres máximos permitidos en un comando remoto,
      incluyendo los parámetros no debe exceder de un total de 80 caracteres.
'''
END = '''

  //END
      Aborta la transferencia de todo fichero de texto que haya sido iniciada
      con el comando //Write. Este comando no puede ser utulizado para abortar 
      las transferencias en el modo AutoBin.
'''
ECHO = '''

  //Echo <texto>
      Este comando es un eco simple y envía de regreso a la estación que
      lo manda el <texto>. Separar al <texto> del comando utilizando un
      <espacio>.
'''
DISCONNECT = '''

  //DISConnect
      Este comando termina el QSO inmediatamente, sin ningún texto de
      despedida y sin enviar o acusar los paquetes pendientes.
'''
DIRECTORY = '''

  //DIRectory [wildcard]
      Esta función, similar a la de //CAT, realiza un volcado del
      directorio accesible a los usuarios. Todos los ficheros dentro de
      dicho directorio pueden ser leídos y enviados a través de los
      comandos //Read o //RPrg. También, //Write o //WPrg escriben ficheros
      dentro de este directorio.
      Pueden asociarse comodines (wildcards) con este comando, como por
      ejemplo, "//DIR *.txt". Pueden usarse además varios comodines
      separados por punto y coma.
      Ejemplo: "//DIR *.txt;*.doc"
'''
DELETE = '''

  //DELete <filename>
      Este comando permite el borrado de un fichero del directorio de
      usuarios. Solo se podrán borrar los ficheros que uno haya enviado.
      con //Write. El resto de los ficheros sólo podrá ser borrado por 
      el SysOp de esta estación.
'''
CUT = '''

  //CUT
      Si se ha iniciado una trnasferencia binaria con el comando //Read,
      este comando puede ser utilizado para detener dicha transferencia.
'''
CATALOG = '''

  //CATalog [wildcard]
      Esta función, similar a la de //DIR, realiza un volcado del
      directorio accesible a los usuarios. Todos los ficheros dentro de
      dicho directorio pueden ser leídos y enviados a través de los
      comandos //Read o //RPrg. También, //Write o //WPrg escriben ficheros
      dentro de este directorio.
      Pueden asociarse comodines (wildcards) con este comando, como por
      ejemplo, "//CAT *.txt". Pueden usarse además varios comodines
      separados por punto y coma.
      Ejemplo: "//CAT *.txt;*.doc"
'''
BELL = '''

  //Bell
      Este comando activa una llamada especial para avisar al operador
      de esta estación (o para despertarlo...). :-)
'''
LANGUAGE = '''

  //Language <lenguaje>
      Con este comando se puede cambiar el idioma en el que se recibirán los
      mensajes remotos. Un "//L" sin parámetros dará el listado de los
      idiomas disponibles.
'''
RTT = '''

  //RTt <puerta>
      Este comando calcula el tiempo de ida y vuelta medio entre el
      envío de un paquete y su acuse por esta estación  (llamado
      "Round Trip time", tiempo medio de enlace). El programa que 
      estés utilizando debe poseer el comando remoto "//Echo", o de
      otro modo la cosa no funcionará. Si se utilizan el BayCom o el
      DigiCom, añádase al comando el número de la puerta propia actual.
      Ejemplo: "//RT 1".
'''
