; File d'inizializzazione per KISSINIT v1.00
;
; Questo file contiene la sequenza dei comandi piu' utilizzati per
; settare un tnc in modo KISS, la sequenza dei comandi deve essere
; richiamata con l'opzione -S<sezione> e con l'opzione -F<file> si
; richiama il file di settaggio.
;
;
;[TF]                    ; TNC2 / The Firmware
;^X\e@K
;
;[TAPR]                  ; TNC2 / TAPR-Software
;KISS ON
;RESTART
;
;[PK232]                 ; PK232
;*
;*
;*
;HB 1200
;*
;VH OFF
;*
;KISS ON
;
;[reset]                 ; Reset PK232
;*
;*
;reset
;
[KAM]                    ; KAM V5.0
PORT 1
INT KISS
RESET
;
;[MFJ]                   ; MFJ-127x
;KISS ON
;RESTART
;

[TS2000]		; Kenwood TS-2000 / 1k2
\k\d\d\d\d\d		; KISS-Reset und 5s Pause
SOFTDCD ON
HBAUD 1200
TX 20
FR 8
KISS ON
RESTART			; Bei Aufruf KISSINIT wird eine 5s Pause mitgegeben (wichtig!)

[TS2000_9600]		; Kenwood TS-2000 / 9k6
\k\d\d\d\d\d		; KISS-Reset und 5s Pause
SOFTDCD ON
HBAUD 9600
TX 20
FR 8
KISS ON
RESTART			; Bei Aufruf KISSINIT wird eine 5s Pause mitgegeben (wichtig!)

[TM-D700]		; Kenwood TM-D700 packet / APRS (PC serial often 9600)
\k\d\d\d\d\d		; KISS-Reset und 5s Pause
KISS ON
RESTART

; Kenwood TM-D710 — Kenwood APRS/EchoLink + UI-View “Into KISS”.
; Radio: press TNC until PACKET12. PC baud = Menu PC PORT SPEED (default 9600).
; ECHO ON first so we can see command echo on the wire before KISS takes over.
; \k first: if a previous run left the radio in KISS, C0 FF C0 returns it to
; command mode so the text commands below are understood.
[TM-D710]
\k\d\d
ECHO ON
^M
KISS ON
RESTART

[TM-D710_9600pkt]	; force 9600 on-air HBAUD before KISS (Kenwood FAQ)
\k\d\d
ECHO ON
^M
HB 9600
KISS ON
RESTART
